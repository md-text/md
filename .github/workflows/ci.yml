name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }}, Crystal ${{ matrix.crystal }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
        crystal: [latest]
        include:
          # Catch upcoming Crystal changes early, on one platform.
          - runner: ubuntu-latest
            crystal: nightly
    steps:
      - uses: actions/checkout@v7

      # shard.override.yml builds against unreleased Crysterm, Tput,
      # Superconf, event_handler and pnggif checkouts beside this one.
      # The tags are the versions shard.lock records; raise both together.
      - name: Check out sibling dependencies
        run: |
          cd ..
          git clone --depth 1 --branch v1.6.0 https://github.com/crystallabs/crysterm crysterm2
          git clone --depth 1 --branch v2.3.0 https://github.com/crystallabs/tput.cr
          git clone --depth 1 --branch v0.3.1 https://github.com/crystallabs/superconf.cr
          git clone --depth 1 --branch v2.4.1 https://github.com/crystallabs/event_handler
          git clone --depth 1 --branch v0.1.2 https://github.com/crystallabs/pnggif

      - name: Update package index (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # Crysterm reads terminfo through unibilium, the one native library
      # beyond Crystal's own runtime that md links against.
      - name: Install unibilium (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libunibilium-dev
      - name: Install unibilium (macOS)
        if: runner.os == 'macOS'
        run: brew install unibilium

      - name: Install dependencies
        run: shards install

      # Tput's term-screen links libreadline for a terminal size fallback
      # that ioctl makes unnecessary; the runners lack its development
      # package, and the release builds leave it out the same way.
      - name: Run specs
        run: crystal spec -Dwithout_readline

      - name: Build
        run: shards build -Dwithout_readline

      - name: Lint
        run: make lint

      # The binary starts and exits without a terminal, and renders without one.
      - name: Smoke test
        run: |
          bin/md --version
          bin/md --help
          bin/md --export html README.md | grep -qE '<h1( [^>]*)?>md</h1>'
          bin/md --generate man | grep -q '^\.TH MD 1'
          # The toolkit's options are read by md itself, with md's registered,
          # and a value that fits no option is a message, not a backtrace.
          bin/md --crysterm-dump-config json README.md | grep -q '"sync_cursor"'
          bin/md --colors-theme=bogus README.md 2>&1 | grep -q '^md: cannot parse "bogus"'
